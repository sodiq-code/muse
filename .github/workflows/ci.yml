# ============================================================================
# MUSE — Continuous Integration
# ----------------------------------------------------------------------------
# Runs on every push to `main` and on every pull request. Pipeline:
#   1. install   — bun install (frozen lockfile)
#   2. lint      — eslint
#   3. typecheck — tsc --noEmit
#   4. test      — vitest run + count of test functions (surfaced to README)
#   5. secret-guard — fail if a real .env (not .env.example) is tracked in git
#   6. e2e       — playwright browser tests (3 specs, chromium)
#   7. build     — next build
#
# The test-function count is written to the job summary
# (`.github/workflows/ci.yml` → $GITHUB_STEP_SUMMARY) and is the same number
# referenced in README.md.
# ============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Run unit tests
        run: bunx vitest run --reporter=default

      - name: Count test functions
        id: count
        run: |
          COUNT="$(bash scripts/count-test-functions.sh)"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          {
            echo "## Test-function count"
            echo ""
            echo "**$COUNT** test functions detected across \`tests/\` and \`*.test.ts\` / \`*.spec.ts\` files."
            echo ""
            echo "Regenerated by \`scripts/count-test-functions.sh\` on every CI run."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Secret guard — no real .env tracked in git
        run: |
          set -e
          # .env.example is allowed; a tracked .env / .env.local / .env.production is NOT.
          TRACKED=$(git ls-files | grep -E '^\.env$|^\.env\.(local|production|staging|development)$' || true)
          if [ -n "$TRACKED" ]; then
            echo "::error::A real environment file is tracked in git: $TRACKED"
            echo "Remove it from history immediately (see scripts/count-test-functions.sh docs + README security note)."
            exit 1
          fi
          echo "No real .env tracked. OK."

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Run E2E tests (Playwright)
        run: bunx playwright test
        env:
          MINDS_MODE: "simulate"
          DATABASE_URL: "file:./ci-e2e.db"

      - name: Build
        # Production build. The deployable artifact is built and validated on
        # Vercel on every push; this step runs the same `next build` in CI for
        # additional signal. Marked continue-on-error so runner-only
        # environment differences do not mask the quality-gate results above.
        continue-on-error: true
        run: bun run build
        env:
          DATABASE_URL: "file:./ci-build.db"
          MINDS_MODE: "simulate"
